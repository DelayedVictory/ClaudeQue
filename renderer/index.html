<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self';"
    />
    <title>ClaudeQue</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="row">
        <select id="project" title="Project queue"></select>
        <button id="browse" class="icon" title="Add a project folder">+</button>
        <button id="forget" class="icon" title="Remove this project from the list">−</button>
        <button id="pin" class="icon on" title="Always on top">📌</button>
      </div>
      <div class="row status">
        <span id="count">no project selected</span>
        <span class="spacer"></span>
        <button id="pause" class="ghost">Pause</button>
        <button id="clear" class="ghost danger">Clear</button>
      </div>
      <div id="statusbar" class="statusbar">
        <span id="statustext"></span>
        <button id="statusaction" class="tiny"></button>
      </div>
    </header>

    <ul id="list"></ul>

    <div id="empty" class="empty">
      <p>Queue is empty.</p>
      <p class="dim">
        Prompts added here are delivered to Claude one at a time, each only
        after the previous finishes.
      </p>
      <p class="dim">
        The queue starts draining at the <em>end of a turn</em> — add prompts,
        then send Claude any message to kick it off.
      </p>
    </div>

    <footer>
      <textarea
        id="input"
        rows="3"
        placeholder="Type a prompt, then Ctrl+Enter to queue it…"
      ></textarea>
      <div class="row">
        <span id="hint" class="dim">Ctrl+Enter to add</span>
        <span class="spacer"></span>
        <button id="add" class="primary">Add to queue</button>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
